name: Android-APK bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Aktuelle Angebote in die App legen
        run: cp data/week.json www/data/week.json

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Kamera-Berechtigung eintragen
        run: sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml && grep -c CAMERA android/app/src/main/AndroidManifest.xml

      - name: App-Icon und Splash erzeugen
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Web-Dateien übertragen
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Geizkragen04.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Geizkragen04-apk
          path: Geizkragen04.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Geizkragen 04 – Version 1.0.${{ github.run_number }}
          body: |
            Neue Version von Geizkragen 04.
            Zum Installieren: Geizkragen04.apk auf dem Handy herunterladen und öffnen.
          files: Geizkragen04.apk
          make_latest: true
